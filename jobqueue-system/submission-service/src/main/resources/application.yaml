spring:
  application:
    name: submission-service

  devtools:
    livereload:
      enabled: false
    restart:
      enabled: true

  datasource:
    url: jdbc:postgresql://localhost:5435/jobqueue
    username: jobqueue
    password: jobqueue123
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 20000
      maximum-pool-size: 5

  data:
    redis:
      host: localhost
      port: 6379

  kafka:
    bootstrap-servers: "localhost:9092"

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    open-in-view: false

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

logging:
  level:
    com.jobqueue: DEBUG
    org.springframework.jdbc: DEBUG